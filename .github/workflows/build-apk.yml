name: Build 2048 AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4
      - name: Unpack uploaded source archive
        run: unzip -q '2048AIAndroid-calibrated-source.zip'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p 2048AIAndroid --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2048-AI-Android-APK
          path: 2048AIAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
